name: Fork Image

# Publishes this fork's own image to ghcr.io/<owner>/floppy. The upstream
# Docker Image workflow is pinned to dannyvfilms/floppy and cannot push from a
# fork, so it stays disabled here and this lighter build replaces it.

on:
  push:
    branches: [latest]
  workflow_dispatch:

concurrency:
  group: fork-image-${{ github.ref }}

permissions:
  contents: read

jobs:
  build:
    if: github.repository != 'dannyvfilms/Floppy'
    name: Build & push image (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0 # git describe needs the tags

      - name: Get version from git
        id: get-version
        run: |
          VERSION=$(git describe --tags 2>/dev/null || echo "dev")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log into GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/floppy
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/latest' }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.get-version.outputs.VERSION }}
            COMMIT_SHA=${{ github.sha }}
